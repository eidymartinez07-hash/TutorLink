{% extends 'base.html' %}{% block content %}<h1>Revisión: {{a.title}}</h1>{% for s in subs %}<section class="card"><h2>Estudiante #{{s.student_id}}</h2><p class="answer">{{s.answer}}</p><form method="post"><input type="hidden" name="_csrf" value="{{csrf}}"><input type="hidden" name="submission_id" value="{{s.id}}"><label>Retroalimentación<textarea name="feedback">{{s.feedback}}</textarea></label><button>Marcar como revisado</button></form></section>{% else %}<p>No hay entregas.</p>{% endfor %}{% endblock %}
