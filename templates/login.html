
{% extends 'base.html' %}

{% block content %}
<div class="auth-layout" style="display:flex; justify-content:center;">

    <section class="card login auth-card">

        <h2>Iniciar sesión</h2>
        <p>Ingresa con tus credenciales para continuar.</p>

        <form method="post">
            <input type="hidden" name="_csrf" value="{{ csrf }}">

            <label>
                Correo electrónico
                <input type="email"
                       name="email"
                       placeholder="nombre@correo.com"
                       required
                       autocomplete="username">
            </label>

            <label>
                Contraseña
                <input type="password"
                       name="password"
                       placeholder="Tu contraseña"
                       required
                       autocomplete="current-password">
            </label>

            <button class="full-button">
                Iniciar sesión
            </button>
        </form>

        <p class="auth-switch">
            ¿Aún no tienes cuenta?
            <a href="{{ url_for('register') }}">Regístrate aquí</a>
        </p>

    </section>

</div>
{% endblock %}
