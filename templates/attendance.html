{% extends 'base.html' %}{% block content %}<section class="card"><h1>Asistencia: {{s.title}}</h1><p>{{s.starts.strftime('%d/%m/%Y %H:%M')}}</p><form method="post"><input type="hidden" name="_csrf" value="{{csrf}}">{% for u in studs %}<label class="check"><input type="checkbox" name="present" value="{{u.id}}" {% if records.get(u.id) %}checked{% endif %}> {{u.name}}</label>{% endfor %}<button>Guardar asistencia</button></form></section>{% endblock %}
