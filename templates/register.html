{% extends 'base.html' %}{% block content %}<section class="login card"><h1>Crear cuenta de estudiante</h1><p>Regístrate para acceder a TutorLink. Coordinación te asignará un tutor académico.</p><form method="post"><input type="hidden" name="_csrf" value="{{csrf}}"><label>Nombre completo<input name="name" maxlength="140" required autocomplete="name"></label><label>Correo electrónico<input type="email" name="email" maxlength="180" required autocomplete="email"></label><label>Contraseña (mínimo 10 caracteres)<input type="password" name="password" minlength="10" required autocomplete="new-password"></label><label>Confirmar contraseña<input type="password" name="confirm" minlength="10" required autocomplete="new-password"></label><button>Crear cuenta</button></form><p style="margin-top:1.5rem">¿Ya tienes cuenta? <a href="{{url_for('login')}}">Inicia sesión</a></p></section>{% endblock %}
