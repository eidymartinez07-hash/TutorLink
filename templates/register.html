
{% extends 'base.html' %}
{% block content %}

<div class="auth-layout" style="display:flex; justify-content:center;">
    <section class="card login auth-card" style="width:100%; max-width:480px;">

        <h2 style="text-align:center;">Registro de alumnos</h2>
        <p style="text-align:center;">
            Completa tus datos para acceder al sistema de tutorías.
        </p>

        <form method="post">
            <input type="hidden" name="_csrf" value="{{ csrf }}">

            <label>Nombre completo
                <input type="text" name="name"
                       placeholder="Nombre y apellidos"
                       maxlength="140" required>
            </label>

            <label>Número de control
                <input type="text" name="numero_control"
                       placeholder="Número de control"
                       inputmode="numeric"
                       pattern="[0-9]{8}"
                       maxlength="8" required>
            </label>

            <label>Correo electrónico
                <input type="email" name="email"
                       placeholder="Correo electrónico"
                       maxlength="180" required>
            </label>

            <label>NIP
                <input type="password" name="password"
                       placeholder="Crea tu NIP"
                       inputmode="numeric"
                       pattern="[0-9]{8,12}"
                       minlength="8" maxlength="12"
                       autocomplete="new-password" required>
            </label>

            <small>El NIP debe contener de 8 a 12 dígitos.</small>

            <label>Confirmar NIP
                <input type="password" name="confirm"
                       placeholder="Repite tu NIP"
                       inputmode="numeric"
                       pattern="[0-9]{8,12}"
                       minlength="8" maxlength="12"
                       autocomplete="new-password" required>
            </label>

            <button type="submit" class="full-button">
                Registrarme
            </button>

        </form>

        <p class="auth-switch">
            ¿Ya tienes cuenta?
            <a href="{{ url_for('login') }}">Iniciar sesión</a>
        </p>

    </section>
</div>

{% endblock %}
